<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'none';
        script-src 'self' 'unsafe-eval';
        worker-src 'self';
        style-src 'self';
        img-src 'self';
        manifest-src 'self';
        connect-src 'self';
        base-uri 'none';
        form-action 'none';
    ">
    <title>Argon2 Calculator</title>
    <meta name="description" content="Derive an Argon2 hash from an input and a salt, entirely in your browser.">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#405158">

    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="icon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icon/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icon/apple-touch-icon.png">
    <link rel="mask-icon" href="icon/safari-pinned-tab.svg" color="#405158">
    <meta name="msapplication-TileColor" content="#405158">
    <meta name="msapplication-config" content="icon/browserconfig.xml">

    <link rel="stylesheet" href="css/app.css">
</head>

<body>
    <header class="header">
        <div class="header__inner">
            <h1>Argon2 Calculator</h1>
            <p class="header__tagline">Runs entirely in your browser</p>
        </div>
    </header>

    <main>
        <form class="card" id="frm" novalidate autocomplete="off">
            <div class="field">
                <label for="txtPassword">Input</label>
                <div class="input-row">
                    <input type="password" id="txtPassword" placeholder="Text to hash"
                        spellcheck="false" autocapitalize="off" autocorrect="off">
                    <button type="button" class="btn" id="btnToggle" aria-pressed="false"
                        aria-controls="txtPassword">Show</button>
                </div>
            </div>

            <div class="field">
                <label for="txtSalt">Salt</label>
                <input type="text" id="txtSalt" placeholder="somesalt" spellcheck="false" autocapitalize="off"
                    autocorrect="off">
                <span class="field__hint">Left blank, the salt is <code>somesalt</code>. Argon2 needs at least 8
                    bytes.</span>
            </div>

            <details id="advanced">
                <summary><span class="summary__label">Advanced parameters</span><span class="summary__hint" id="advancedHint"></span></summary>
                <div class="advanced__body">
                    <div class="grid">
                        <div class="field">
                            <label for="txtMem">Memory (KiB)</label>
                            <input type="number" id="txtMem" min="8" step="1" inputmode="numeric">
                        </div>
                        <div class="field">
                            <label for="txtIt">Iterations</label>
                            <input type="number" id="txtIt" min="1" step="1" inputmode="numeric">
                        </div>
                        <div class="field">
                            <label for="txtPar">Parallelism</label>
                            <input type="number" id="txtPar" min="1" step="1" inputmode="numeric">
                        </div>
                        <div class="field">
                            <label for="txtLen">Hash length (bytes)</label>
                            <input type="number" id="txtLen" min="4" step="1" inputmode="numeric">
                        </div>
                    </div>

                    <fieldset class="field variant">
                        <legend class="label">Variant</legend>
                        <div class="segmented">
                            <label><input type="radio" name="radioType" value="0"><span>Argon2d</span></label>
                            <label><input type="radio" name="radioType" value="1"><span>Argon2i</span></label>
                            <label><input type="radio" name="radioType" value="2" checked><span>Argon2id</span></label>
                        </div>
                    </fieldset>

                    <div class="advanced__actions">
                        <button type="button" class="btn btn--link" id="btnReset">Reset to defaults</button>
                    </div>
                </div>
            </details>

            <button type="submit" id="btnCalc" class="btn btn--primary">Calculate</button>

            <hr class="divider">

            <div class="field result">
                <label for="txtRes">Result</label>
                <div class="input-row">
                    <input type="text" id="txtRes" readonly placeholder="Hex-encoded hash" spellcheck="false">
                    <button type="button" class="btn" id="copyButton" disabled>Copy</button>
                </div>
                <p class="status" id="status" role="status" aria-live="polite"></p>
            </div>
        </form>

        <noscript>
            <p class="status status--error">This calculator needs JavaScript and WebAssembly to run.</p>
        </noscript>
    </main>

    <footer>
        Nothing you type leaves this page. Hashing uses the
        <a href="https://github.com/antelle/argon2-browser" rel="noopener">argon2-browser</a> WebAssembly build ·
        <a href="https://github.com/Jeffreyhung/argon2" rel="noopener">Source</a>
    </footer>

    <script src="js/main.js"></script>
</body>

</html>
